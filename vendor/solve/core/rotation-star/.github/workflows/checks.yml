name: checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS arm64: the committed C++ emissions inline the Slang prelude as the macOS slangc
    # writes it, so --check compares like with like.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: slangc 2026.13
        run: |
          curl -sSfL -o slang.tar.gz https://github.com/shader-slang/slang/releases/download/v2026.13/slang-2026.13-macos-aarch64.tar.gz
          mkdir -p "$HOME/slang" && tar -xzf slang.tar.gz -C "$HOME/slang"
          echo "$HOME/slang/bin" >> "$GITHUB_PATH"
      - name: lake build (proofs and pins)
        working-directory: lean
        run: lake build
      - name: properties and controls
        working-directory: lean
        run: lake exe rotation_star_test
      - name: oracle is Lean's
        run: tests/oracle/gen.sh --check
      - name: kernels are Lean's
        run: kernels/gen.sh --check
      - name: C port against the oracle
        run: c/build.sh
      - name: C++ emission against the oracle
        run: tests/kernels/build.sh
