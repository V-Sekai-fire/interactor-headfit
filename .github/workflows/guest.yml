name: guest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  headfit-elf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: weft/3-interactor/headfit
      - name: Tools from apt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build python3
      - name: The goal manifest's sibling checkouts
        working-directory: weft
        run: |
          for p in 2-contract/guest-runtime:contract-guest-runtime 2-contract/guest-common:contract-guest-common \
                   2-contract/lbfgsb:contract-lbfgsb 2-contract/sinew-align:contract-sinew-align \
                   3-interactor/drape:interactor-drape 5-repository/riscv64-sysroot:repository-riscv64-sysroot; do
            git clone -q --depth 1 "https://github.com/V-Sekai-fire/${p#*:}" "${p%%:*}"
            echo "${p%%:*} $(git -C "${p%%:*}" rev-parse HEAD)" >> "$RUNNER_TEMP/siblings.txt"
          done
          cat "$RUNNER_TEMP/siblings.txt"
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          manifest-path: weft/5-repository/riscv64-sysroot/pixi.toml
          cache: false
      - name: clang and lld from the riscv64-sysroot checkout
        working-directory: weft/5-repository/riscv64-sysroot
        run: |
          echo "$PWD/.pixi/envs/default/bin" >> "$GITHUB_PATH"
          .pixi/envs/default/bin/clang++ --print-targets | grep -q riscv64
          .pixi/envs/default/bin/clang++ --version | head -1
      - name: headfit.elf
        working-directory: weft/3-interactor/headfit
        run: |
          cmake -S guest -B "$RUNNER_TEMP/rv64" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/weft/5-repository/riscv64-sysroot/toolchain.cmake" \
            -DWEFT_ROOT="$GITHUB_WORKSPACE/weft"
          cmake --build "$RUNNER_TEMP/rv64" --target headfit
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/rv64/headfit" "$RUNNER_TEMP/out/headfit.elf"
          cp "$RUNNER_TEMP/siblings.txt" "$RUNNER_TEMP/out/headfit.elf.siblings.txt"
      - name: The ELF a double-precision viewer loads, with the anime API
        run: python3 weft/3-interactor/headfit/tests/headfit/check_elf.py "$RUNNER_TEMP/out/headfit.elf"
      - name: The check fails on a single-precision ELF (control)
        run: |
          python3 - "$RUNNER_TEMP/out/headfit.elf" "$RUNNER_TEMP/single.elf" <<'E'
          import sys
          b = bytearray(open(sys.argv[1], "rb").read())
          i = b.find(b"SBXV(\0\0\0")
          b[i + 4] = 24
          open(sys.argv[2], "wb").write(b)
          E
          if python3 weft/3-interactor/headfit/tests/headfit/check_elf.py "$RUNNER_TEMP/single.elf"; then
            echo "the check passed a 24-byte Variant"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: headfit-elf-${{ github.sha }}
          path: ${{ runner.temp }}/out/
